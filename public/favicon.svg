<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#10b981" stroke-width="6" stroke-opacity="0.25"/>
  <!-- Shield outline -->
  <path d="M256 96 L384 152 V264 C384 344 329 406 256 428 C183 406 128 344 128 264 V152 Z" fill="#1e293b" stroke="url(#accent)" stroke-width="12" stroke-linejoin="round"/>
  <!-- Central $ sign -->
  <text x="256" y="295" font-family="'JetBrains Mono', monospace" font-size="160" font-weight="900" fill="url(#accent)" text-anchor="middle">$</text>
  <!-- Venezuelan Bs spark badge -->
  <circle cx="360" cy="160" r="38" fill="url(#gold)"/>
  <text x="360" y="171" font-family="'Plus Jakarta Sans', sans-serif" font-size="30" font-weight="900" fill="#0f172a" text-anchor="middle">Bs</text>
</svg>